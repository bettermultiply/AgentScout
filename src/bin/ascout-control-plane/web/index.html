<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AScout</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui;background:#11151c;color:#dce4ef}*{box-sizing:border-box}body{margin:0}header{padding:18px 24px;border-bottom:1px solid #303a48;display:flex;gap:20px;align-items:center}h1{font-size:20px;margin:0;color:#80d8cf}button,textarea{font:inherit;color:inherit;background:#1d2633;border:1px solid #3b4b60;border-radius:8px}button{padding:8px 12px;cursor:pointer}button:hover{border-color:#80d8cf}button:disabled{opacity:.4;cursor:default}main{display:grid;grid-template-columns:270px minmax(0,1fr);height:calc(100vh - 78px)}aside{padding:18px;border-right:1px solid #303a48;overflow:auto}aside button{display:block;width:100%;text-align:left;margin-bottom:8px;overflow-wrap:anywhere}.selected{border-color:#80d8cf}section{min-width:0;display:flex;flex-direction:column;padding:20px;overflow:hidden}#content{flex:1;overflow:auto}article,details{border:1px solid #303a48;border-radius:8px;margin:12px 0;padding:14px}article.user{border-left:3px solid #80d8cf}article.toolResult{border-left:3px solid #8ca8e6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.6 ui-monospace,monospace;margin:8px 0}.muted{color:#96a5b8}.warning{color:#ffd28a}form{display:flex;gap:10px;padding-top:14px}textarea{width:100%;resize:vertical;padding:12px;min-height:70px}#notice{font-size:13px;padding-top:8px}nav{display:flex;gap:8px;flex-wrap:wrap}h2{font-size:18px;margin:10px 0}@media(max-width:700px){main{grid-template-columns:1fr;height:auto}aside{max-height:230px}section{min-height:70vh}header{flex-wrap:wrap}}
</style>
<header><h1>AScout</h1><span class="muted">执行观察与对话</span><button id="interrupt">中断当前执行</button><button id="shutdown">结束运行</button></header>
<main><aside><button id="main">当前主对话</button><h2>Branch</h2><div id="branches"></div></aside><section><nav><button data-tab="messages">对话内容</button><button data-tab="facts">运行事实</button><button data-tab="events">事件</button></nav><h2 id="title"></h2><div id="authority" class="warning"></div><div id="content"></div><form><textarea placeholder="向当前权威 Branch 发送消息" aria-label="消息"></textarea><button id="send">发送</button></form><div id="notice" class="muted"></div></section></main>
<script>
let state,selected=null,tab='messages',last='',busy=false;
const $=s=>document.querySelector(s);
const node=(tag,text,cls)=>{const n=document.createElement(tag);n.textContent=text??'';if(cls)n.className=cls;return n};
const format=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
function message(entry){const a=node('article','',entry.role);a.append(node('strong',({user:'你',assistant:'Agent',toolResult:'工具结果'})[entry.role]||entry.role));if(entry.toolName)a.append(node('span',' · '+entry.toolName));const parts=typeof entry.content==='string'?[{type:'text',text:entry.content}]:entry.content||[];for(const p of parts){if(p.type==='thinking'){const d=node('details');d.append(node('summary','思考内容'),node('pre',p.thinking));a.append(d)}else if(p.type==='toolCall'){a.append(node('strong','工具调用 · '+p.name),node('pre',format(p.arguments)))}else a.append(node('pre',p.text||'[暂未展示的内容：'+p.type+']'))}if(entry.errorMessage)a.append(node('pre',entry.errorMessage,'warning'));return a}
function render(){const id=selected||state.tree.authority_branch_id,b=state.tree.branches[id],c=state.conversations[id]||{inherited:[],messages:[],streaming:''};$('#branches').replaceChildren();for(const branch of Object.values(state.tree.branches)){const n=node('button',branch.branch_id+' · '+branch.status,selected===branch.branch_id?'selected':'');n.onclick=()=>{selected=branch.branch_id;last='';render()};$('#branches').append(n)}$('#title').textContent=selected?'Branch '+id+' · 只读观察':'当前主对话 · '+(id||'等待启动');$('#authority').textContent=selected?(id===state.tree.authority_branch_id?'当前权威路径；观察模式不接收输入':'非当前权威路径；候选内容未验证，查看不代表接受'):'';$('#send').disabled=!!selected||!state.connected||!state.ready||busy;$('textarea').disabled=!!selected||!state.connected;$('#interrupt').disabled=!!selected||!state.connected;$('#shutdown').disabled=!state.connected;$('#notice').textContent=state.connected?state.notice:'控制面已断开；以下是最后收到的事实';const key=JSON.stringify([id,tab,c,state.facts,tab==='messages'?null:state.events,b]);if(key===last)return;last=key;const content=$('#content'),atEnd=content.scrollHeight-content.scrollTop-content.clientHeight<70,old=content.scrollTop;content.replaceChildren();if(tab==='messages'){if(c.inherited.length){const d=node('details');d.append(node('summary','继承上下文 · '+c.inherited.length+' 条消息'));for(const e of c.inherited)d.append(message(e));content.append(d)}content.append(node('h2','本 Branch 独有内容'));for(const e of c.messages)content.append(message(e));if(c.streaming)content.append(node('pre',c.streaming));if(!c.messages.length&&!c.streaming)content.append(node('p','尚无消息','muted'))}else if(tab==='facts'){content.append(node('pre',format(b)));content.append(node('pre',state.facts[id]||'尚无运行事实'));for(const e of state.events.filter(e=>e.branch_id===id))content.append(node('pre',format(e)))}else for(const e of state.events)content.append(node('pre',format(e)));content.scrollTop=atEnd?content.scrollHeight:old}
async function request(body){const r=await fetch('/api/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text())}
async function poll(){try{const r=await fetch('/api/run-view');if(!r.ok)throw Error(r.status);state=await r.json();render()}catch(e){$('#notice').textContent='连接失败：'+e.message;$('#send').disabled=true}setTimeout(poll,600)}
$('#main').onclick=()=>{selected=null;last='';render()};for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>{tab=b.dataset.tab;render()};$('form').onsubmit=async e=>{e.preventDefault();const prompt=$('textarea').value.trim();if(!prompt||selected||busy)return;busy=true;render();try{await request({action:'prompt',prompt});$('textarea').value=''}catch(e){$('#notice').textContent=e.message}finally{busy=false;render()}};$('#interrupt').onclick=()=>request({action:'interrupt'}).catch(e=>$('#notice').textContent=e.message);$('#shutdown').onclick=()=>{if(confirm('停止此次运行？'))request({action:'shutdown'}).catch(e=>$('#notice').textContent=e.message)};poll();
</script></html>
