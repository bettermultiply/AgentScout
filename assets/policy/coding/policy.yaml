version: 1
language: python
files: [decisions.py]
fidelity: Best-effort
decisions:
  admit:
    opportunity_pass:
      file: decisions.py
      function: opportunity_pass
      policy_config:
        fast_model_speculation: true
        tool_speculation: true
    feasibility_pass:
      file: decisions.py
      function: feasibility_pass
      policy_config:
        max_assumption_depth: 1
  select:
    file: decisions.py
    function: select
    policy_config:
      max_active_candidates: 2
  launch:
    file: decisions.py
    function: launch
  predict:
    file: decisions.py
    function: predict
    history: {mode: transcript_tail, max_entries: 30}
    policy_config:
      readonly_reset_steps: 2
      share_inflight_commands: false
      candidate_model: deepseek/deepseek-flash
      candidate_thinking: "off"
      candidate_count: 1
      speculate_early_modify: true
      active_post_edit_test: true
      adaptive_dual_tool_speculation: true
      fail_candidate_model: deepseek/deepseek-flash
      fail_candidate_thinking: "off"
      fail_candidate_guidance: >-
        The verification command failed, though its failure output has not arrived yet.
        Treat this failure as real and do not re-run the test command before inspecting or editing code.
  extent:
    file: decisions.py
    function: extent
    inputs: [process_state.result_facts, process_state.semantic_facts]
    policy_config:
      max_steps: 12
  effect:
    file: decisions.py
    function: effect
  rebalance:
    file: decisions.py
    function: rebalance
    policy_config:
      max_active_candidates: 2
      preempt_failed_tools: 2
  match:
    file: decisions.py
    function: match_proposal
    outcome: tool_output
    policy_config:
      safe_result_count: 4
  dispose:
    file: decisions.py
    function: dispose
    policy_config:
      safe_result_count: 4
      verification_output_chars: 20000
