version: 1
language: python
files: [decisions.py]
fidelity: Best-effort
policy_model_grant:
  decisions: [match]
  models: [openai/gpt-6.2-sol]
  max_requests: 1
  timeout_ms: 25000
decisions:
  admit:
    opportunity_pass:
      file: decisions.py
      function: opportunity_pass
      policy_config:
        fast_model_speculation: false
    feasibility_pass:
      file: decisions.py
      function: feasibility_pass
      policy_config:
        max_assumption_depth: 1
        max_model_speculation_step: null
  select:
    file: decisions.py
    function: select
    policy_config:
      max_active_candidates: 2
  launch:
    file: decisions.py
    function: launch
    policy_config:
      skip_authority_after_independent_verification: false
      eager_authority_verification: false
  predict:
    file: decisions.py
    function: predict_for_control_plane
    history: {mode: transcript_tail, max_entries: 30}
    policy_config:
      fast_model_speculation: false
      candidate_model: deepseek/deepseek-flash
      candidate_thinking: high
      candidate_count: 1
      max_candidate_model_steps: 1
  extent:
    file: decisions.py
    function: extent
    inputs: [process_state.result_facts, process_state.semantic_facts, process_state.resource_counters]
    policy_config:
      max_steps: 4
      fast_model_speculation: false
      max_candidate_model_steps: 1
  effect:
    file: decisions.py
    function: effect
  rebalance:
    file: decisions.py
    function: rebalance
    policy_config:
      max_active_candidates: 2
  match:
    file: decisions.py
    function: match_proposal
    outcome: tool_output
    policy_config:
      skip_authority_after_independent_verification: false
      require_authority_review: false
      partial_accept_unverified_workspace: false
      semantic_audit: false
      audit_model: openai/gpt-6.2-sol
  dispose:
    file: decisions.py
    function: dispose
    policy_config:
      salvage_independent_results: false
      require_authority_review: false
      partial_accept_reuse: false
      partial_accept_salvage: false
      partial_accept_unverified_workspace: false
      partial_accept_discard: true
