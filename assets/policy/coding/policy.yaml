version: 1
language: python
files: [decisions.py]
fidelity: Best-effort
decisions:
  admit:
    opportunity_pass:
      file: decisions.py
      function: opportunity_pass
      policy_config:
        fast_model_speculation: false
        tool_speculation: true
    feasibility_pass:
      file: decisions.py
      function: feasibility_pass
      policy_config:
        max_assumption_depth: 1
  select:
    file: decisions.py
    function: select
    policy_config:
      max_active_candidates: 2
  launch:
    file: decisions.py
    function: launch
    policy_config:
      prior_readonly_exploration: false
  predict:
    file: decisions.py
    function: predict
    history: {mode: transcript_tail, max_entries: 30}
    policy_config:
      candidate_model: deepseek/deepseek-flash
      candidate_thinking: "off"
      active_post_edit_test: true
      candidate_count: 1
      adaptive_dual_tool_speculation: true
  extent:
    file: decisions.py
    function: extent
    inputs: [process_state.result_facts, process_state.semantic_facts, process_state.resource_counters]
    policy_config:
      max_steps: 12
      stop_before_mutation: true
  effect:
    file: decisions.py
    function: effect
  rebalance:
    file: decisions.py
    function: rebalance
    policy_config:
      max_active_candidates: 2
  match:
    file: decisions.py
    function: match_proposal
    outcome: tool_output
    policy_config:
      prior_readonly_exploration: false
      readonly_salvage: true
      yield_in_flight_verification: true
      min_partial_coverage: 0.25
  dispose:
    file: decisions.py
    function: dispose
