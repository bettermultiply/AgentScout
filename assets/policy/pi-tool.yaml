version: 1
language: python
files:
  - decisions.py
fidelity: Best-effort
runtime: nle-runtime.json
decisions:
  admit:
    opportunity_pass:
      file: decisions.py
      function: opportunity_pass
    feasibility_pass:
      file: decisions.py
      function: feasibility_pass
      policy_config:
        example_tools_only: true
  select:
    file: decisions.py
    function: select
    policy_config:
      max_edges: 1
  rebalance:
    file: decisions.py
    function: rebalance
  extent:
    file: decisions.py
    function: extent
    policy_config:
      max_steps: 5
  predict:
    file: decisions.py
    function: predict
    policy_config:
      candidates: ["example", "true", "false"]
      value_type: enum
      enum_values: ["example", "true", "false"]
      sample_count: 2
  launch:
    file: decisions.py
    function: launch
  effect:
    file: decisions.py
    function: effect
  match:
    file: decisions.py
    function: match_proposal
    policy_config:
      value_type: enum
      enum_values: ["example", "true", "false"]
  dispose:
    file: decisions.py
    function: dispose
